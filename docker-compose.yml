name: bizstruct

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizstruct_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - .:/app
      # Anonymous volume so the bind mount above doesn't shadow the venv
      # baked into the image with the (likely absent/mismatched) host one.
      - /app/.venv
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bizstruct_net

  db:
    image: postgres:15-alpine
    container_name: bizstruct_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bizstruct}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bizstruct}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - bizstruct_net

volumes:
  postgres_data:

networks:
  bizstruct_net:
    driver: bridge
